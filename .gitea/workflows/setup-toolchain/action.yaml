name: Setup Toolchain

runs:
  using: "composite"
  steps:
    - name: Rustup Mirror
      run: |
        echo "RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup" >> $GITHUB_ENV
        echo "RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup" >> $GITHUB_ENV

    - name: Setup Toolchain
      uses: https://gitee.com/skr2005/setup-rust-toolchain@main
      with:
        toolchain: stable
        target: x86_64-unknown-linux-musl
        components: clippy, rustfmt
        cache-all-crates: "true"

    - run: echo "/root/.cargo/bin" >> $GITHUB_PATH

    - name: Crates Mirror
      run: |
        mkdir -vp ${CARGO_HOME:-$HOME/.cargo}

        cat << EOF | tee ${CARGO_HOME:-$HOME/.cargo}/config.toml
        [source.crates-io]
        replace-with = 'rsproxy-sparse'

        [source.rsproxy]
        registry = "https://rsproxy.cn/crates.io-index"

        [source.rsproxy-sparse]
        registry = "sparse+https://rsproxy.cn/index/"

        [registries.rsproxy]
        index = "https://rsproxy.cn/crates.io-index"

        [net]
        git-fetch-with-cli = true
        EOF
