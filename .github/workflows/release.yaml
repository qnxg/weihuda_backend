on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Switch to independent Ubuntu mirrors
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          MIRROR_FILE=/etc/apt/apt-mirrors.txt

          if [[ ! -f "$MIRROR_FILE" ]]; then
            echo "::error::APT mirror list not found"
            exit 1
          fi

          printf '%s\n' \
            'https://mirrors.edge.kernel.org/ubuntu/' \
            'https://mirrors.mit.edu/ubuntu/' \
            'http://mirror.math.princeton.edu/pub/ubuntu' \
            'http://mirror.us.leaseweb.net/ubuntu' \
            'http://ubuntu.osuosl.org/ubuntu' \
            | sudo tee "$MIRROR_FILE" >/dev/null

          echo "APT mirrors:"
          cat "$MIRROR_FILE"

          sudo apt-get update

      - name: Install Musl Tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          cache-all-crates: "true"

      - name: Setup .env
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: echo "DATABASE_URL=$TEST_DATABASE_URL" > .env

      - name: Build
        run: |
          cargo build --release --bin weihuda_backend --target x86_64-unknown-linux-musl

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_HOST }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ vars.DOCKER_HOST }}/weihuda_backend:latest
