[package]
name = "back_2024"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
unsafe_code = "forbid"
# unused = "allow"       # for exploratory development

[dependencies]
anyhow = "1.0.79"
axum = "0.7.4"
bytes = "1.5.0"
chrono = { version = "0.4.31", features = ["serde"] }
clia-tracing-config = "0.2.7"
jsonwebtoken = "9.2.0"
lazy_static = "1.4.0"
mime = "0.3.17"
once_cell = "1.19.0"
redis = { version = "0.24.0", default-features = false, features = [
    "tokio-comp",
] }
regex = { version = "1.10.3", default-features = false }
reqwest = { version = "0.11.23", default-features = false, features = [
    "default-tls",
    # "rustls-tls",
] }
serde = "1.0.195"
serde_json = { version = "1.0.111" }
# serde_json = { version = "1.0.111", features = ["preserve_order"] }
serde_path_to_error = "0.1.15"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.30"
sqlx = { version = "0.7.3", features = ["mysql", "runtime-tokio", "chrono"] }
thiserror = "1.0.56"
tokio = { version = "1.35.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5.1", features = [
    "validate-request",
    "trace",
    "timeout",
    "cors",
] }
tracing = "0.1.40"

[dev-dependencies]

[profile.release] # 优化发布release编译时的性能和体积，但会影响编译时间，完整编译大约两分钟多
opt-level = 3
debug = false
codegen-units = 1       # 代码单元联合优化
lto = "fat"             # 链接时优化，降低编译速度
overflow-checks = false # 溢出检查
