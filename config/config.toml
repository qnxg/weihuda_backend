[server]
name = "back_2024"
address = "0.0.0.0:8000"

[database]
max_connections = 100
database_url = "mysql://用户名:密码@ip地址:端口/weihuda"

[redis]
redis_url = "redis://用户名:密码@ip地址:端口/"

[jwt]
secret = "__qnxg__jwt_secret__"

[wechat]
appid = "wxd285bdf58cb899f4"
secret = "ea93f2019c75f5376ee048dc409885ab"

[captcha]
captcha_url = "http://ip地址:端口" # 验证码服务地址，结尾不要加斜杠

[rabbitmq]
url = "amqp://用户名:密码@ip地址:端口号/virtualHost名称" # VirtualHost名称如果为"/"，需要写成 "%2f"
feedback_exchange = "feedback"               # 设置反馈消息应该发送到哪个 exchange

[log]
filter_level = "error" # 可用的日志等级："debug", "info", "warn", "error"
with_ansi = false      # 有ansi字符美化控制台输出
to_stdout = true       # 输出到控制台，当打开时候不会写入到日志。在生产环境中应关闭
directory = "./logs"   # 日志目录
file_name = "qnxg.log" # 日志前缀
rolling = "daily"      # 可用的日志滚动策略："minutely", "hourly", "daily", "never"
format = "pretty"      # 日志输出格式，生产环境中使用 json 格式方便你日志收集
