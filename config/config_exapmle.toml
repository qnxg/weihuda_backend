[server]
name = "back_2024"
address = "0.0.0.0:8000"

[database]
max_connections = 100
database_url = "mysql://用户名:密码@ip地址:端口/weihuda"

[redis]
redis_url = "redis://用户名:密码@ip地址:端口/"

[wechat]
appid = ""
secret = ""

[captcha]
# 验证码服务地址，目前用于识别大物实验平台的验证码。结尾不要加斜杠。
captcha_url = "http://ip地址:端口"

[rabbitmq]
# VirtualHost名称如果为"/"，需要写成 "%2f"
url = "amqp://用户名:密码@ip地址:端口号/virtualHost名称"
# 设置反馈消息应该发送到哪个 exchange
feedback_exchange = "feedback"

[secret]
# jwt 的密钥
jwt = ""
# 数据库中存储的密码加密用的密钥
password = ""

[pow]
# 工作量证明过期时间，单位：秒
expired_time = 300
# 工作量证明难度，值越大，难度越大
difficulty = 4

[log]
# 可用的日志等级："debug", "info", "warn", "error"
filter_level = "error"
# 有ansi字符美化控制台输出
with_ansi = false
# 输出到控制台，当打开时候不会写入到日志。在生产环境中应关闭
to_stdout = true
# 日志目录
directory = "./logs"
# 日志前缀
file_name = "qnxg.log"
# 可用的日志滚动策略："minutely", "hourly", "daily", "never"
rolling = "daily"
# 日志输出格式。调试时可以使用 pretty 格式。生产环境中使用 json 格式用于日志收集
format = "pretty"
