      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 兑换记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      tags: [积分]
      summary: 兑换积分商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goodsId]
              properties:
                goodsId:
                  type: integer
                  format: uint32
      responses:
        "200":
          description: 兑换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /jifen/webview-read:
    get:
      tags: [积分]
      summary: 阅读知湖文章并领取积分
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 领取结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /jifen:
    post:
      tags: [积分]
      summary: 添加积分
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  example: qiandao
                  description: 目前支持签到
                param:
                  type: string
                  description: 兼容字段，可传空
      responses:
        "200":
          description: 积分变动结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /zhihu:
    get:
      tags: [知湖]
      summary: 获取知湖文章列表
      parameters:
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: req_count
          in: query
          required: true
          schema:
            type: integer
            maximum: 100
          description: 每页条数，最大 100
        - name: title
          in: query
          schema:
            type: string
        - name: typ
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 文章列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedApiResponse"

  /zhihu/tags:
    get:
      tags: [知湖]
      summary: 获取知湖标签列表
      security: []
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /zhihu/{id}:
    get:
      tags: [知湖]
      summary: 根据 ID 获取知湖文章详情
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint32
      responses:
        "200":
          description: 文章详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /notice:
    get:
      tags: [通知]
      summary: 获取通知列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedApiResponse"

  /notice/{id}:
    put:
      tags: [通知]
      summary: 更新通知状态
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: integer
                  format: uint32
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /feedback:
    get:
      tags: [反馈]
      summary: 获取我的反馈列表
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 反馈列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedApiResponse"
    post:
      tags: [反馈]
      summary: 提交反馈（Token 可选）
      description: |
        已登录：忽略 body 中的 stuId，使用 JWT 对应学号。
        未登录：stuId 与 contact 必填，且不保存 stuId 到库。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFeedbackReq"
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /feedback/no_auth:
    post:
      tags: [反馈]
      summary: 提交反馈（无需 Token，同 POST /feedback）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFeedbackReq"
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /feedback/msg:
    get:
      tags: [反馈]
      summary: 获取反馈对话消息
      parameters:
        - name: feedbackId
          in: query
          required: true
          schema:
            type: integer
            format: uint32
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /message-left:
    post:
      tags: [留言]
      summary: 提交毕业留言
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostLeftMessageReq"
      responses:
        "200":
          description: 留言成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 直接填写 JWT 字符串

  parameters:
    QrCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    Xn:
      name: xn
      in: query
      required: true
      schema:
        type: integer
      description: 学年起始年
    Xq:
      name: xq
      in: query
      required: true
      schema:
        type: integer
      description: "0=秋 1=春 2=夏"
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 10

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        data: {}
        msg:
          type: string
          example: 请求成功

    ApiResponseString:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: string

    ApiResponseNull:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              nullable: true

    ApiResponseObject:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true

    PagedApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                rows:
                  type: array
                  items: {}

    Announcement:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string

    BindUserReq:
      type: object
      required: [code, stuId, password]
      properties:
        code:
          type: string
          description: 微信 code
        stuId:
          type: string
          description: 学号
        password:
          type: string
          description: 个人门户密码

    UserInfo:
      type: object
      properties:
        class:
          type: string
        name:
          type: string
        major:
          type: string
        enter:
          type: integer
        college:
          type: string
        sex:
          type: string
        xz:
          type: integer
          description: 学制
        stuId:
          type: string

    SemesterInfo:
      type: object
      properties:
        startDate:
          type: string
        term:
          type: integer
        year:
          type: integer
        vacation:
          type: string
        next:
          type: string

    AddCourseReq:
      type: object
      required: [classname, week, section, day, xn, xq]
      properties:
        classname:
          type: string
        location:
          type: string
        teachers:
          type: string
        week:
          type: string
        section:
          type: string
        day:
          type: string
        xn:
          type: integer
        xq:
          type: integer

    ExamArrange:
      type: object
      properties:
        id:
          type: string
          description: 课程代码
        name:
          type: string
        place:
          type: string
        date:
          type: string
          description: YYYY-MM-DD
        time:
          type: string
          description: 如 14:00~16:00
        seat:
          type: string

    ExamNumberReq:
      type: object
      required: [examNum, examName, examDate]
      properties:
        examNum:
          type: string
        examName:
          type: string
        examDate:
          type: string

    AddFeedbackReq:
      type: object
      required: [desc]
      properties:
        stuId:
          type: string
          description: 未登录时必填
        desc:
          type: string
        contact:
          type: string
          description: 未登录时必填
        imgUrl:
          type: string

    PostLeftMessageReq:
      type: object
      required: [desc, isAgree, isSend, sendTime]
      properties:
        desc:
          type: string
        isAgree:
          type: integer
          description: 非 0 表示同意
        isSend:
          type: integer
          description: 非 0 表示定时发送
        sendTime:
          type: string
          format: date-time
          description: 发送时间
        email:
          type: string
