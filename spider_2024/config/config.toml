[server]
name = "spider_2024"
address = "0.0.0.0:8002"

[database]
database_url = "mysql://用户名:密码@ip地址:3306/weihuda"

[redis]
redis_url = "redis://:密码@ip地址:端口/"

[captcha]
captcha_url = "http://ip地址:端口" # 验证码服务地址，结尾不要加斜杠

[log]
filter_level = "error"  # 可用的日志等级："debug", "info", "warn", "error"
with_ansi = false   # 有ansi字符美化控制台输出
to_stdout = false    # 输出到控制台，当打开时候不会写入到日志。在生产环境中应关闭
directory = "./logs"    # 日志目录
file_name = "spider.log"  # 日志前缀
rolling = "hourly"   # 可用的日志滚动策略："minutely", "hourly", "daily", "never"
